name: Mise à jour de l'archive CPU

on:
  schedule:
    - cron: "0 */6 * * *"   # toutes les 6h
  workflow_dispatch: {}      # bouton "Run workflow" manuel sur GitHub

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Mettre à jour archive.json
        run: node scripts/update-archive.mjs

      - name: Commit si changement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add archive.json
          git diff --cached --quiet || git commit -m "Mise à jour archive CPU"
          git push