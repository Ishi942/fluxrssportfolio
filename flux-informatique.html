<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Veille processeurs (CPU)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Google+Sans+Text:wght@400;500;700&family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    /* Palette calée sur le thème sombre par défaut de Google Sites (surface Material dark) */
    --bg: #202124;
    --panel: #292a2d;
    --line: #3c4043;
    --text: #e8eaed;
    --muted: #9aa0a6;
    --accent: #8ab4f8;      /* bleu "Google dark theme" */
    --ok: #81c995;
    --c-clubic: #f28b82;
    --c-comptoir: #fdd663;
    --c-cowcotland: #81c995;
    --c-tomshw: #8ab4f8;
    --mono: 'Roboto Mono', 'SFMono-Regular', Consolas, monospace;
    --sans: 'Google Sans Text', Roboto, -apple-system, 'Segoe UI', sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--sans);}
  .wrap{max-width:760px;margin:0 auto;padding:20px 18px 28px;}

  .head{display:flex;align-items:baseline;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:14px;}
  .head h1{font-size:17px;font-weight:500;letter-spacing:0.01em;margin:0;color:var(--text);}
  .head .sub{display:block;font-size:12px;font-weight:400;color:var(--muted);margin-top:3px;}
  .head .meta{font-family:var(--mono);font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap;}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--ok);}

  .cols{font-family:var(--mono);font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:0.06em;display:grid;grid-template-columns:56px 118px 1fr;gap:12px;padding:0 4px 8px;border-bottom:1px solid var(--line);margin-bottom:2px;}

  .entries{display:flex;flex-direction:column;}
  .entry{display:grid;grid-template-columns:56px 118px 1fr;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);text-decoration:none;color:inherit;transition:background 0.15s ease;}
  .entry:hover{background:rgba(138,180,248,0.06);}
  .entry:hover .title{color:var(--accent);}
  .time{font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap;padding-top:1px;}
  .src{font-size:10.5px;font-weight:500;letter-spacing:0.02em;padding:2px 7px;border-radius:10px;height:fit-content;justify-self:start;background:rgba(255,255,255,0.06);color:var(--src-color, var(--accent));}
  .body-col{min-width:0;}
  .title{font-size:13.5px;font-weight:500;line-height:1.4;margin:0 0 3px;color:var(--text);transition:color 0.15s ease;}
  .desc{font-size:12px;color:var(--muted);line-height:1.45;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}

  .state{font-family:var(--sans);font-size:13px;color:var(--muted);padding:26px 4px;text-align:center;}
  .state.error{color:#f28b82;}
  .footer{font-family:var(--mono);font-size:10px;color:var(--muted);text-align:right;padding-top:12px;}
  .footer button{font-family:var(--sans);font-size:11px;background:var(--panel);border:1px solid var(--line);color:var(--text);padding:4px 10px;border-radius:14px;cursor:pointer;}
  .footer button:hover{border-color:var(--accent);color:var(--accent);}

  @media (max-width:480px){
    .cols{display:none;}
    .entry{grid-template-columns:1fr;gap:4px;}
    .time{order:1;}
    .src{order:0;justify-self:start;}
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="head">
    <h1>Veille processeurs
      <span class="sub">Évolution des CPU (architectures, gammes, cœurs, gravure) — depuis le 1er septembre 2026</span>
    </h1>
    <div class="meta"><span class="dot"></span><span id="statusText">connexion…</span></div>
  </div>

  <div class="cols">
    <span>date</span><span>source</span><span>entrée</span>
  </div>

  <div class="entries" id="entries">
    <div class="state" id="loading">chargement des flux…</div>
  </div>

  <div class="footer">
    <span id="lastUpdate"></span>
    <button id="refreshBtn">actualiser</button>
  </div>

</div>

<script>
// L'archive est désormais un fichier statique (archive.json) tenu à jour côté serveur
// par un workflow GitHub Actions (scripts/update-archive.mjs) — plus de localStorage,
// donc ça fonctionne même dans l'iframe sandboxée de Google Sites.
//
// IMPORTANT : "archive.json" est chargé en chemin RELATIF. Héberge ce fichier HTML
// au même endroit (même dossier GitHub Pages) que archive.json pour que ça fonctionne.
// Si besoin, remplace par une URL absolue, ex. :
// const ARCHIVE_URL = "https://tonpseudo.github.io/ton-repo/archive.json";
const ARCHIVE_URL = "archive.json";

function formatDate(dateStr){
  const d = new Date(dateStr);
  const now = new Date();
  const sameDay = d.toDateString() === now.toDateString();
  if (sameDay) return "auj. " + d.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"});
  return d.toLocaleDateString("fr-FR",{day:"2-digit",month:"2-digit",year:"2-digit"});
}

async function loadAll(){
  const statusText = document.getElementById("statusText");
  const entriesEl = document.getElementById("entries");
  const dot = document.querySelector(".dot");
  statusText.textContent = "connexion…";

  let archive = [];
  try{
    const res = await fetch(ARCHIVE_URL + "?t=" + Date.now()); // évite le cache
    if (!res.ok) throw new Error("HTTP " + res.status);
    archive = await res.json();
  } catch(e){
    console.error("Impossible de charger l'archive", e);
    entriesEl.innerHTML = '<div class="state error">Impossible de charger archive.json. Vérifie qu\'il est bien au même endroit que cette page, et que le workflow GitHub Actions a déjà tourné au moins une fois.</div>';
    statusText.textContent = "erreur";
    dot.style.background = "#f28b82";
    return;
  }

  if (!Array.isArray(archive) || archive.length === 0){
    entriesEl.innerHTML = '<div class="state">Aucun article sur les processeurs depuis le 1er septembre 2026 pour le moment.</div>';
    statusText.textContent = "0 entrée";
    dot.style.background = "var(--ok)";
    return;
  }

  archive.sort((a, b) => new Date(b.date) - new Date(a.date));

  entriesEl.innerHTML = archive.map(it => `
    <a class="entry" href="${it.link}" target="_blank" rel="noopener noreferrer">
      <span class="time">${formatDate(it.date)}</span>
      <span class="src" style="--src-color:${it.color}">${it.source}</span>
      <span class="body-col">
        <p class="title">${it.title}</p>
        <p class="desc">${it.desc}</p>
      </span>
    </a>
  `).join("");

  statusText.textContent = archive.length + " entrées";
  dot.style.background = "var(--ok)";
  document.getElementById("lastUpdate").textContent =
    "maj " + new Date().toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"});
}

document.getElementById("refreshBtn").addEventListener("click", loadAll);
loadAll();
</script>
</body>
</html>
